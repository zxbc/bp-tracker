<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>bp-tracker chart preview</title>
<style>
  body { margin: 0; padding: 24px; background: #fafdfb; font-family: system-ui, sans-serif; }
  h2 { color: #191c1b; font-size: 18px; margin: 0 0 4px; }
  .sub { color: #41423f; font-size: 13px; margin-bottom: 16px; }
  svg { background: #fafdfb; border-radius: 12px; }
</style>
</head>
<body>
<h2>Chart preview — mirrors app.bp.ui.review.BpChart</h2>
<div class="sub">Same geometry, scale rules and colors as the Compose Canvas code (M3 light teal palette).</div>
<div id="chart"></div>
<script>
// ---- sample data: 7 days, 2 measurements per day (morning + night) ----
const now = new Date();
function daysAgo(n, hour) {
  const d = new Date(now);
  d.setDate(d.getDate() - n);
  d.setHours(hour, 7, 0, 0);
  return d.getTime();
}
const readings = [
  // [ts, sys, dia, hr]
  [daysAgo(6, 7), 124, 79, 68], [daysAgo(6, 21), 131, 84, 74],
  [daysAgo(5, 8), 121, 78, 66], [daysAgo(5, 22), 126, 82, 71],
  [daysAgo(4, 7), 118, 76, 64], [daysAgo(4, 21), 122, 79, 69],
  [daysAgo(3, 9), 127, 81, 73], [daysAgo(3, 21), 119, 77, 65],
  [daysAgo(2, 7), 116, 74, 62], [daysAgo(2, 22), 121, 78, 67],
  [daysAgo(1, 8), 129, 83, 76], [daysAgo(1, 21), 123, 80, 70],
  [daysAgo(0, 7), 117, 75, 63],
];

// ---- palette: M3 light, fixed teal fallback (Theme.kt) ----
const C = {
  primary: "#0F766E",
  cap: "#0A4C47",                       // blend(primary, black, 0.35)
  onSurface: "#191C1B",
  onSurfaceVariant: "#41423F",
  grid: "rgba(25,28,27,0.10)",
  hrLine: "rgba(25,28,27,0.35)",
  hrDot: "rgba(25,28,27,0.55)",
  bg: "#FAFDFB",
};

// ---- geometry: mirrors BpChart.drawChart ----
const W = 720, H = W / 1.4;             // aspectRatio(1.4f)
const padLeft = 30, padTop = 8, padBottom = 40, padRight = 6;
const plotLeft = padLeft, plotRight = W - padRight;
const plotTop = padTop, plotBottom = H - padBottom;

const dataMin = Math.min(...readings.map(r => Math.min(r[2], r[3])));
const dataMax = Math.max(...readings.map(r => Math.max(r[1], r[3])));
const yMin = Math.min(50, dataMin - 10);
const yMax = Math.max(150, dataMax + 15);
const y = v => plotBottom - (v - yMin) / (yMax - yMin) * (plotBottom - plotTop);

// day buckets
const byDay = new Map();
for (const [ts] of readings) {
  const d = new Date(ts);
  const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  if (!byDay.has(key)) byDay.set(key, { key, date: d, list: [] });
  byDay.get(key).list.push(ts);
}
const buckets = [...byDay.values()].sort((a, b) => a.date - b.date);
const bandW = (plotRight - plotLeft) / 7;

let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
svg += `<rect x="0" y="0" width="${W}" height="${H}" fill="${C.bg}" rx="12"/>`;

// gridlines + y labels
let grid = Math.ceil(yMin / 20) * 20;
while (grid <= yMax) {
  const gy = y(grid);
  svg += `<line x1="${plotLeft}" y1="${gy}" x2="${plotRight}" y2="${gy}" stroke="${C.grid}" stroke-width="1"/>`;
  svg += `<text x="${plotLeft - 6}" y="${gy + 4}" font-size="11" fill="${C.grid.replace("0.10", "0.60")}" text-anchor="end" font-family="monospace">${grid}</text>`;
  grid += 20;
}

// x labels + bars + hr points
const hrPoints = [];
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
buckets.forEach((bucket, i) => {
  const bandLeft = plotLeft + bandW * i;
  const cx = bandLeft + bandW / 2;
  const isToday = bucket.key === `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
  const lc = isToday ? C.primary : C.onSurfaceVariant;
  svg += `<text x="${cx}" y="${H - 22}" font-size="11" fill="${lc}" text-anchor="middle">${WEEKDAYS[bucket.date.getDay()]}</text>`;
  svg += `<text x="${cx}" y="${H - 8}" font-size="11" fill="${lc}" text-anchor="middle">${bucket.date.getDate()}</text>`;
  if (bucket.list.length === 0) return;
  const dayReadings = readings.filter(r => bucket.list.includes(r[0]));
  const n = dayReadings.length;
  const slot = bandW / n;
  const barWidth = Math.min(14, slot * 0.34);
  dayReadings.forEach((r, j) => {
    const x = bandLeft + slot * (j + 0.5);
    const ySys = y(r[1]), yDia = y(r[2]);
    svg += `<line x1="${x}" y1="${ySys}" x2="${x}" y2="${yDia}" stroke="${C.primary}" stroke-width="${barWidth}" stroke-linecap="round"/>`;
    svg += `<circle cx="${x}" cy="${ySys}" r="${barWidth * 0.62}" fill="${C.cap}"/>`;
    hrPoints.push([x, y(r[3])]);
  });
});

// hr dotted line (dots every 5px, r=1.3) + value dots (r=2.3)
for (let k = 0; k < hrPoints.length - 1; k++) {
  const [ax, ay] = hrPoints[k], [bx, by] = hrPoints[k + 1];
  const dist = Math.hypot(bx - ax, by - ay);
  for (let d = 0; d < dist; d += 5) {
    const t = d / dist;
    svg += `<circle cx="${ax + (bx - ax) * t}" cy="${ay + (by - ay) * t}" r="1.3" fill="${C.hrLine}"/>`;
  }
}
hrPoints.forEach(([px, py]) => svg += `<circle cx="${px}" cy="${py}" r="2.3" fill="${C.hrDot}"/>`);

svg += `</svg>`;
document.getElementById("chart").innerHTML = svg;
</script>
</body>
</html>
